<style>
/* Layout: plain test list on the home screen; exam screen copies the computer-delivered IELTS: top bar with timer, content, question navigator along the bottom. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#18212B; --muted:#5B6673; --line:#DFE3E9;
  --accent:#1D58B5; --accent-soft:#E6EDF9; --on-accent:#FFFFFF;
  --good:#1F7546; --good-soft:#E1F1E7; --bad:#B4382C; --bad-soft:#FAE5E2; --warn:#9A6200;
  --c1:#1D58B5; --c2:#D07A1F; --c3:#2A8A57; --c4:#8A5AB0;
  --font:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161C; --surface:#1A2029; --ink:#E6EAF0; --muted:#9AA5B3; --line:#2C3542;
  --accent:#7AA7F0; --accent-soft:#1E2C44; --on-accent:#0F1624;
  --good:#6FCB95; --good-soft:#18301F; --bad:#F08C80; --bad-soft:#3A1E1B; --warn:#E3B055;
  --c1:#7AA7F0; --c2:#F0A55C; --c3:#6FCB95; --c4:#C29BE6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1A2029; --ink:#E6EAF0; --muted:#9AA5B3; --line:#2C3542;
  --accent:#7AA7F0; --accent-soft:#1E2C44; --on-accent:#0F1624;
  --good:#6FCB95; --good-soft:#18301F; --bad:#F08C80; --bad-soft:#3A1E1B; --warn:#E3B055;
  --c1:#7AA7F0; --c2:#F0A55C; --c3:#6FCB95; --c4:#C29BE6; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:clamp(26px,4vw,34px);font-weight:700}
h2{font-size:22px;font-weight:600}
h3{font-size:18px;font-weight:600}
p{margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.sm{padding:5px 11px;font-size:14px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.check input{accent-color:var(--accent);width:18px;height:18px}

/* home */
header.site{background:var(--surface);border-bottom:1px solid var(--line)}
header.site .wrap{padding-block:22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.home{padding-block:24px 64px;display:flex;flex-direction:column;gap:20px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:13px;color:var(--muted)}
.tests{display:flex;flex-direction:column;gap:0}
.trow{display:grid;grid-template-columns:110px repeat(4,minmax(0,1fr)) 150px;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow.head{padding-top:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.trow .tname{font-weight:700;font-size:17px}
.cell{display:flex;align-items:center;gap:8px}
.cell .sec{display:none;font-size:13px;color:var(--muted);min-width:76px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:3px 8px;border-radius:6px;font-family:var(--mono);font-size:14px;font-weight:500}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.mid{background:var(--accent-soft);color:var(--accent)}
.badge.low{background:var(--bad-soft);color:var(--bad)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tablebox{overflow-x:auto}

/* exam shell */
.ebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.ebar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.ebar .title{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;padding:3px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.ebody{padding-block:20px 24px}
.enav{position:sticky;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.enav .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.parts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.parts button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-size:14px}
.parts button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.parts button small{opacity:.8;margin-left:6px;font-family:var(--mono)}
.nums{display:flex;gap:4px;flex-wrap:wrap}
.nums button{width:32px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-family:var(--mono);font-size:13px;cursor:pointer;padding:0}
.nums button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

/* questions */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.pane{max-height:calc(100vh - 220px);overflow:auto}
.panetabs{display:none;gap:6px;margin-bottom:12px}
.panetabs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;cursor:pointer;font-weight:600}
.panetabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.passage h2{margin-bottom:12px}
.passage p{margin-bottom:14px;max-width:72ch;line-height:1.7}
.passage .pl{font-weight:700;margin-right:8px;color:var(--accent)}
.qgroup{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.qinstr{font-size:15px;background:var(--bg);border-radius:8px;padding:10px 12px}
.qinstr b{display:block;margin-bottom:2px}
.optlist{margin:0;padding:10px 14px;border:1px solid var(--line);border-radius:8px;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:15px}
.optlist b{display:inline-block;min-width:34px;font-family:var(--mono);font-weight:500}
.q{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:8px;scroll-margin-top:90px;scroll-margin-bottom:140px}
.qn{flex:none;display:inline-grid;place-items:center;min-width:30px;height:28px;border-radius:6px;border:1px solid var(--line);font-family:var(--mono);font-size:13px;background:var(--surface)}
.qbody{flex:1;min-width:0}
.qbody .qt{margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:4px}
.opts.inline{flex-direction:row;flex-wrap:wrap;gap:6px}
.opts label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:2px 0}
.opts.inline label{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:14px;align-items:center}
.opts input{accent-color:var(--accent);margin-top:5px}
.opts.inline input{margin-top:0}
input.gap{border:1px solid var(--line);border-bottom:2px solid var(--accent);background:var(--surface);padding:3px 8px;width:10em;max-width:100%;border-radius:6px 6px 0 0}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 8px;max-width:100%}
.listenbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.speaking-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}

/* writing */
textarea.essay{width:100%;min-height:420px;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);line-height:1.7;resize:vertical}
.chart svg{width:100%;height:auto;display:block;max-width:640px}
.chart text{fill:var(--ink);font-family:var(--font);font-size:13px}
.chart .grid{stroke:var(--line)}
.chart .axis{stroke:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* results */
.big{font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ok{color:var(--good);font-weight:600}
.no{color:var(--bad);font-weight:600}
tr.wrong td{background:var(--bad-soft)}
details{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--surface)}
details summary{cursor:pointer;font-weight:600}
.script p{margin-top:6px}
.script b{color:var(--accent)}
.model p{margin-bottom:12px;line-height:1.7;max-width:72ch}
.cue{white-space:pre-line;border:2px solid var(--ink);border-radius:8px;padding:16px 18px;max-width:520px;line-height:1.7}
.bigq{font-size:22px;font-weight:600;max-width:40ch}

@media (max-width:820px){
  .split{grid-template-columns:minmax(0,1fr)}
  .pane{max-height:none;overflow:visible}
  .panetabs{display:flex}
  .split .pane[data-hide="1"]{display:none}
  .trow{grid-template-columns:minmax(0,1fr);gap:6px}
  .trow.head{display:none}
  .cell .sec{display:inline}
  .kpis{gap:8px}
  .kpi b{font-size:22px}
}
@media (prefers-reduced-motion:reduce){.speaking-dot{animation:none}}

/* ---------- EXAM STATE ---------- */
let ex=null, timerId=null;
function clearTimer(){if(timerId){clearInterval(timerId); timerId=null;}}
async function start(testId,sec,full){
  stopAudio(); clearTimer();
  let test;
  try{
    if(!cache[testId]) app.innerHTML=`<div class="wrap" style="padding-block:40px"><p class="muted">Loading test…</p></div>`;
    test=await loadTest(testId);
  }catch(e){
    app.innerHTML=`<div class="wrap" style="padding-block:40px"><p>This test couldn't be loaded. Check your connection and try again.</p><button class="btn" style="margin-top:12px" id="backBtn">Back to tests</button></div>`;
    document.getElementById("backBtn").addEventListener("click",home); return;
  }
  ex={test,sec,full,part:0,ans:{},played:{},pane:"passage",writeTab:0,essays:["",""],step:0};
  if(sec==="listening"||sec==="reading"){
    const parts=sec==="listening"?test.listening.parts:test.reading.passages;
    let n=0; const flat=[];
    parts.forEach((p,pi)=>p.groups.forEach(g=>{g._start=n+1; g.items.forEach(it=>{n++; flat.push({n,pi,g,it});}); g._end=n;}));
    ex.parts=parts; ex.flat=flat;
  }
  if(sec==="reading") startTimer(60,()=>submitQA(true));
  if(sec==="writing"){
    const d=(store.drafts||{})[test.id]; if(d) ex.essays=d.slice(0,2);
    startTimer(60,()=>submitWriting(true));
  }
  shell();
}
function startTimer(min,onEnd){

}

  }
  if(g.type==="mcq"){
    return `<div class="q" id="q${n}"><span class="qn">${n}</span><div class="qbody"><div class="qt">${esc(it.q)}</div><div class="opts">${it.options.map((o,i)=>{const L="ABCD"[i]; return `<label><input type="radio" name="a${n}" value="${L}" data-n="${n}" ${v===L?"checked":""}><span><b>${L}</b>&nbsp; ${esc(o)}</span></label>`;}).join("")}</div></div></div>`;

  }

  return `<div class="q" id="q${n}"><span class="qn">${n}</span><div class="qbody">${parts.length>1?esc(parts[0])+inp+esc(parts.slice(1).join("")):esc(it.q)+" "+inp}</div></div>`;
}
function groupsHTML(groups){
  return groups.map(g=>{
    let h=`<div class="qgroup"><div class="qinstr"><b>Questions ${g._start}${g._end>g._start?"–"+g._end:""}</b>${esc(g.instr)}</div>`;

/* ---------- LISTENING ---------- */
let audio={on:false,stop:false};
function stopAudio(){audio.stop=true; audio.on=false; try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}}
function pickVoices(speakers){
  const all=((window.speechSynthesis&&speechSynthesis.getVoices())||[]).filter(v=>/^en[-_]/i.test(v.lang));
  const M=["daniel","google uk english male","arthur","oliver","george","ryan","thomas","alex","fred","male"];
  const F=["serena","google uk english female","karen","moira","samantha","libby","sonia","kate","tessa","victoria","female"];
  const find=list=>all.filter(v=>list.some(n=>v.name.toLowerCase().includes(n)));
  const pools={m:find(M),f:find(F)};
  const used={m:0,f:0}, out={};
  Object.keys(speakers).forEach(id=>{const g=speakers[id].g; const pool=pools[g].length?pools[g]:all; const v=pool[used[g]%Math.max(1,pool.length)]||null; out[id]={voice:v,pitch:(g==="m"?0.9:1.1)+(used[g]?0.12:0)}; used[g]++;});
  return out;
}
function playPart(pi){
  const part=ex.parts[pi];
  if(!window.speechSynthesis){$("#playStatus").textContent="This browser cannot play audio. Open the transcript after submitting and use it as reading practice."; return;}
  stopAudio(); audio={on:true,stop:false};
  const vs=pickVoices(part.speakers);
  let i=0;
  const btn=$("#playBtn"); if(btn) btn.disabled=true;
  const st=$("#playStatus"); if(st) st.innerHTML=`<span class="speaking-dot"></span>Playing Part ${pi+1}. Answer as you listen.`;
  const next=()=>{
    if(audio.stop||!ex) return;
    if(i>=part.script.length){audio.on=false; ex.played[pi]=true; const s=$("#playStatus"); if(s&&ex.part===pi) s.textContent="Recording finished. Check your answers, then go to the next part."; const b=$("#playBtn"); if(b&&ex.part===pi){b.disabled=!store.replay; b.textContent=store.replay?"Play again":"Played";} return;}
    const [who,text]=part.script[i]; const v=vs[who]||{};
    const u=new SpeechSynthesisUtterance(text);
    if(v.voice){u.voice=v.voice; u.lang=v.voice.lang;} else u.lang="en-GB";
    u.pitch=v.pitch||1; u.rate=0.95;
    u.onend=()=>{i++; setTimeout(next,350);}; u.onerror=()=>{i++; setTimeout(next,80);};
    speechSynthesis.speak(u);
  };
  next();
}
function renderListening(){
  const pi=ex.part, part=ex.parts[pi];
  const canPlay=!audio.on&&(!ex.played[pi]||store.replay);
  $("#ebody").innerHTML=`

      <p class="muted" id="playStatus" style="font-size:14px;margin-top:4px">${ex.played[pi]?"Recording finished.":audio.on?"Another part is playing.":"Read the questions first, then press play. You will hear the recording once."}</p></div>
      <button class="btn" id="playBtn" ${canPlay?"":"disabled"}>${ex.played[pi]?(store.replay?"Play again":"Played"):"Play Part "+(pi+1)}</button>
    </div>
    <div class="card" id="qs">${groupsHTML(part.groups)}</div>`;

/* ---------- checking ---------- */
const norm=s=>String(s??"").toLowerCase().trim().replace(/\s*a\.?m\.?$/,"").replace(/[$£’'".,]/g,"").replace(/\s+/g," ").trim();
function correct(g,it,val){
  if(!String(val??"").trim()) return false;
  if(g.type==="gap"){const acc=(Array.isArray(it.answer)?it.answer:[it.answer]).map(norm); return acc.includes(norm(val)) || acc.map(a=>a.replace(/ /g,"")).includes(norm(val).replace(/ /g,""));}
  return String(val).trim().toUpperCase()===String(it.answer).trim().toUpperCase();
}
function showAns(g,v){
  if(v==null||v==="") return "";
  if(g.type==="match"){const o=g.options.find(o=>o.v===v); return o?`${v} · ${o.t}`:v;}
  if(g.type==="mcq") return v;
  return Array.isArray(v)?v[0]:v;
}
function submitQA(auto){
  stopAudio(); clearTimer();
  let raw=0;
  const rows=ex.flat.map(f=>{const v=ex.ans[f.n]??""; const ok=correct(f.g,f.it,v); if(ok) raw++;
    return {n:f.n,pi:f.pi,ok,yours:showAns(f.g,v)||"–",right:showAns(f.g,Array.isArray(f.it.answer)?f.it.answer[0]:f.it.answer)};});
  const total=ex.flat.length, band=bandFor(ex.sec,Math.round(raw/total*40));
  store.attempts.push({test:ex.test.id,sec:ex.sec,band,score:`${raw}/${total}`,date:new Date().toISOString()}); save();
  const need=Math.max(0,35-raw);
  const label=ex.sec==="listening"?"Part":"Passage";
  const breakdown=ex.parts.map((p,i)=>{const r=rows.filter(x=>x.pi===i); return `<li>${label} ${i+1}: <b class="mono">${r.filter(x=>x.ok).length}/${r.length}</b></li>`;}).join("");
  const scripts=ex.sec==="listening"?`<h2>Transcripts</h2>${ex.parts.map((p,i)=>`<details><summary>Part ${i+1} transcript</summary><div class="script">${p.script.map(([w,t])=>`<p><b>${esc(p.speakers[w].name)}:</b> ${esc(t)}</p>`).join("")}</div></details>`).join("")}`:"";
  $("#enav").innerHTML="";
  $("#ebody").innerHTML=`<div class="stack">
    <div class="card">
      ${auto?`<p class="no" style="margin-bottom:10px">Time is up. Your answers were submitted automatically.</p>`:""}
      <div class="row" style="gap:28px;align-items:flex-end">
        <div><p class="label">${SECNAME[ex.sec]} band</p><div class="big">${fmt(band)}</div></div>
        <div><p><b class="mono">${raw} / ${total}</b> correct</p><p class="muted">${need?`Band 8 needs 35. You need ${need} more.`:"That's Band 8 or higher."}</p></div>
        <ul style="margin:0;padding-left:18px">${breakdown}</ul>
      </div>
      <div class="row" style="margin-top:18px">${nextBtn()}<button class="btn ghost" data-home>Back to tests</button></div>
    </div>
    <div class="card"><h2 style="margin-bottom:10px">Answers</h2><div class="tablebox"><table><thead><tr><th>Q</th><th>Your answer</th><th>Correct answer</th><th></th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="${r.ok?"":"wrong"}"><td class="num">${r.n}</td><td>${esc(r.yours)}</td><td>${esc(r.right)}</td><td>${r.ok?`<span class="ok">✓</span>`:`<span class="no">✗</span>`}</td></tr>`).join("")}
    </tbody></table></div></div>
    ${scripts}
    ${ex.sec==="reading"&&SOURCES[ex.test.id]?`<div class="card"><h2>Sources for these passages</h2><p class="muted" style="font-size:14px;margin-top:4px">The passages were written for this test, based on the following research and reports.</p>${sourcesHTML(ex.test.id)}</div>`:""}
  </div>`;
  bindAfter(); window.scrollTo(0,0);
}
function nextBtn(){
  if(!ex.full) return "";
  const i=SECS.indexOf(ex.sec); if(i>=SECS.length-1) return "";
  const nx=SECS[i+1];
  return `<button class="btn" data-next="${nx}">Continue to ${SECNAME[nx]}</button>`;
}
function bindAfter(){
  $$("[data-home]").forEach(b=>b.addEventListener("click",home));
  $$("[data-next]").forEach(b=>b.addEventListener("click",()=>start(ex.test.id,b.dataset.next,true)));
}

/* ---------- WRITING ---------- */
function chartHTML(c){
  const colors=["var(--c1)","var(--c2)","var(--c3)","var(--c4)"];
  if(c.type==="table"){
    return `<p style="font-weight:600;margin-bottom:6px">${esc(c.title)}</p><div class="tablebox"><table style="max-width:520px"><thead><tr><th></th>${c.series.map(s=>`<th>${esc(s.name)}</th>`).join("")}</tr></thead><tbody>${c.categories.map((cat,i)=>`<tr><td>${esc(cat)}</td>${c.series.map(s=>`<td class="num">${s.values[i]}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  const W=640,H=320,L=46,R=16,T=16,B=44,pw=W-L-R,ph=H-T-B;
  const mx=Math.max(...c.series.flatMap(s=>s.values));
  const step=mx<=10?1:mx<=25?5:10, top=Math.ceil(mx/step)*step+(mx%step===0?step:0);
  const tickStep=top/step>8?step*2:step;
  const y=v=>T+ph-(v/top)*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}">`;
  for(let v=0;v<=top+1e-9;v+=tickStep) s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${+v.toFixed(1)}</text>`;
  const n=c.categories.length, gw=pw/n;
  if(c.type==="bar"){
    const k=c.series.length, bw=Math.min(36,(gw*0.7)/k);
    c.categories.forEach((cat,i)=>{const x0=L+gw*i+gw/2-(bw*k)/2;
      c.series.forEach((se,j)=>{const v=se.values[i]; s+=`<rect x="${x0+j*bw}" y="${y(v)}" width="${bw-3}" height="${T+ph-y(v)}" rx="2" fill="${colors[j]}"/>`;});
      s+=`<text x="${L+gw*i+gw/2}" y="${H-B+20}" text-anchor="middle">${esc(cat)}</text>`;});
  } else {
    const xs=i=>L+gw*i+gw/2;
    c.categories.forEach((cat,i)=>{s+=`<text x="${xs(i)}" y="${H-B+20}" text-anchor="middle">${esc(cat)}</text>`;});
    c.series.forEach((se,j)=>{s+=`<polyline fill="none" stroke="${colors[j]}" stroke-width="2.5" points="${se.values.map((v,i)=>xs(i)+","+y(v)).join(" ")}"/>`+se.values.map((v,i)=>`<circle cx="${xs(i)}" cy="${y(v)}" r="4" fill="${colors[j]}"/>`).join("");});
  }
  s+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}"/></svg>`;
  return `<p style="font-weight:600;margin-bottom:6px">${esc(c.title)}</p><div class="legend">${c.series.map((se,j)=>`<span><i style="background:${colors[j]}"></i>${esc(se.name)}</span>`).join("")}</div>${s}`;
}
const words=t=>{const m=String(t).trim().match(/\S+/g); return m?m.length:0;};
function renderWriting(){
  const w=ex.test.writing, k=ex.writeTab, task=k===0?w.task1:w.task2, min=k===0?150:250;
  $("#ebody").innerHTML=`
    <div class="split">
      <div class="card"><p class="label">Writing Task ${k+1}</p><p style="margin-top:6px;max-width:68ch">${esc(task.text)}</p>
        <p class="muted" style="font-size:14px;margin-top:8px">${k===0?"Spend about 20 minutes on this task.":"Spend about 40 minutes on this task. Task 2 counts for twice as much as Task 1."}</p>
        ${task.chart?`<div class="chart" style="margin-top:14px">${chartHTML(task.chart)}</div>`:""}</div>
      <div><textarea class="essay" id="essay" spellcheck="false" aria-label="Your answer for Task ${k+1}" placeholder="Type your answer here. Spell-check is off, as in the real test.">${esc(ex.essays[k])}</textarea>
        <p class="mono" id="wc" style="margin-top:6px;font-size:14px"></p></div>
    </div>`;
  const ta=$("#essay"), wc=$("#wc");
  const upd=()=>{const n=words(ta.value); wc.textContent=`${n} words (minimum ${min})`; wc.style.color=n>=min?"var(--good)":"var(--muted)";};
  upd();
  let tmo=null;
  ta.addEventListener("input",()=>{ex.essays[k]=ta.value; upd(); clearTimeout(tmo); tmo=setTimeout(()=>{store.drafts=store.drafts||{}; store.drafts[ex.test.id]=ex.essays; save();},600);});
  $("#enav").innerHTML=`<div class="wrap"><div class="navrow">
    <div class="parts"><button data-wt="0" aria-current="${k===0}">Task 1<small>${words(ex.essays[0])} w</small></button><button data-wt="1" aria-current="${k===1}">Task 2<small>${words(ex.essays[1])} w</small></button></div>
    <span id="submitBox"></span></div></div>`;
  $$("[data-wt]").forEach(b=>b.addEventListener("click",()=>{ex.writeTab=+b.dataset.wt; renderWriting(); window.scrollTo(0,0);}));
  const box=$("#submitBox");
  const sub=()=>{box.innerHTML=`<button class="btn sm" id="wSub">Submit Writing</button>`; $("#wSub").addEventListener("click",()=>{
    box.innerHTML=`<span class="row"><span class="muted" style="font-size:14px">Finished both tasks?</span><button class="btn sm" id="wYes">Submit</button><button class="btn ghost sm" id="wNo">Keep writing</button></span>`;
    $("#wYes").addEventListener("click",()=>submitWriting(false)); $("#wNo").addEventListener("click",sub);});};
  sub();
}
const CHECK1=["I described the chart in my own words in the first sentence, not by copying the task.","I wrote a clear overview of the main trends or biggest differences.","I included accurate numbers to support each point.","I compared the data, not just listed it.","I did not give my opinion.","I used a range of language for change and comparison (rose, halved, overtook, by contrast).","I wrote at least 150 words."];
const CHECK2=["My position is clear in the introduction and the conclusion.","I answered every part of the question.","Each body paragraph has one main idea, explained and supported with an example.","I used linking words naturally, not at the start of every sentence.","I used precise vocabulary and avoided repeating the same words.","I checked tenses, articles (a/the) and plurals.","I wrote at least 250 words."];
function submitWriting(auto){
  clearTimer();
  const w=ex.test.writing, n1=words(ex.essays[0]), n2=words(ex.essays[1]);
  store.attempts.push({test:ex.test.id,sec:"writing",band:null,score:`${n1} + ${n2} words`,date:new Date().toISOString()}); save();
  const block=(k,task,mine,list,min)=>`
    <div class="card stack">
      <h2>Task ${k}</h2>
      <p class="muted">${esc(task.text)}</p>
      <div class="split">
        <div><p class="label" style="margin-bottom:8px">Your answer · ${words(mine)} words ${words(mine)<min?`<span class="no">(under ${min})</span>`:""}</p><div class="model">${mine.trim()?mine.trim().split(/\n\s*\n|\n/).map(p=>`<p>${esc(p)}</p>`).join(""):`<p class="muted">Nothing written.</p>`}</div></div>
        <div><p class="label" style="margin-bottom:8px">Band 8 model answer</p><div class="model">${task.model.map(p=>`<p>${esc(p)}</p>`).join("")}</div></div>
      </div>
      <div><p class="label" style="margin-bottom:8px">Check your answer</p>${list.map((c,i)=>`<label class="check" style="display:flex;margin-bottom:6px;align-items:flex-start"><input type="checkbox" id="ck${k}-${i}" style="margin-top:3px"> <span>${esc(c)}</span></label>`).join("")}</div>
    </div>`;
  $("#enav").innerHTML="";
  $("#ebody").innerHTML=`<div class="stack">
    <div class="card">${auto?`<p class="no" style="margin-bottom:8px">Time is up. Your writing was submitted automatically.</p>`:""}
      <h2>Writing submitted</h2>
      <p class="muted" style="margin-top:6px;max-width:70ch">Read the model answer next to yours. Underline phrases you could use, then tick the checklist honestly. Rewriting one paragraph using the model is the fastest way to improve.</p>
      <div class="row" style="margin-top:14px">${nextBtn()}<button class="btn ghost" data-home>Back to tests</button></div></div>
    ${block(1,w.task1,ex.essays[0],CHECK1,150)}
    ${block(2,w.task2,ex.essays[1],CHECK2,250)}
  </div>`;
  store.drafts&&delete store.drafts[ex.test.id]; save();
  bindAfter(); window.scrollTo(0,0);
}

/* ---------- SPEAKING ---------- */
function speakSteps(){
  const sp=ex.test.speaking, steps=[{kind:"intro"}];
  sp.part1.forEach(t=>t.qs.forEach(q=>steps.push({kind:"p1",topic:t.topic,q})));
  steps.push({kind:"cue"});
  sp.part3.forEach(q=>steps.push({kind:"p3",q}));
  steps.push({kind:"end"});
  return steps;
}
let cueId=null;
function renderSpeaking(){
  clearInterval(cueId); cueId=null;
  const sp=ex.test.speaking, steps=speakSteps(), s=steps[ex.step];
  const p1n=steps.filter(x=>x.kind==="p1").length, p3n=steps.filter(x=>x.kind==="p3").length;
  let body="";
  if(s.kind==="intro"){
    body=`<p class="label">Speaking test · about 11–14 minutes</p><h2 style="margin-top:6px">Before you start</h2>
      <ul style="margin:12px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:66ch">
        <li>Start a voice recording on your phone now, and keep it running for the whole test.</li>
        <li>Answer every question out loud, in full sentences, as if an examiner were in front of you.</li>
        <li>Part 1: answers of 2–3 sentences. Part 2: speak for up to 2 minutes. Part 3: longer answers with reasons and examples.</li>
        <li>At the end, listen to your recording and compare it with the model answer.</li></ul>`;
  } else if(s.kind==="p1"){
    const i=steps.indexOf(s)-0;
    body=`<p class="label">Part 1 · ${esc(s.topic)} · question ${steps.slice(0,ex.step+1).filter(x=>x.kind==="p1").length} of ${p1n}</p><p class="bigq" style="margin-top:12px">${esc(s.q)}</p>`;
  } else if(s.kind==="cue"){
    body=`<p class="label">Part 2 · long turn</p><p style="margin:8px 0 14px;max-width:62ch">You have one minute to prepare and make notes. Then speak for one to two minutes.</p>
      <div class="cue">${esc(sp.cue)}</div>
      <div class="row" style="margin-top:16px"><span class="timer" id="cueClock">1:00</span><button class="btn ghost sm" id="cueBtn">Start preparation</button><span class="muted" id="cueHint" style="font-size:14px"></span></div>`;
  } else if(s.kind==="p3"){
    body=`<p class="label">Part 3 · discussion · question ${steps.slice(0,ex.step+1).filter(x=>x.kind==="p3").length} of ${p3n}</p><p class="bigq" style="margin-top:12px">${esc(s.q)}</p><p class="muted" style="margin-top:10px">Give your opinion, a reason, and an example.</p>`;
  } else {
    body=`<h2>Speaking test finished</h2><p class="muted" style="margin-top:6px;max-width:66ch">Stop your recording and listen back. Notice where you paused, repeated words or used very simple vocabulary. Then read the model Part 2 answer aloud twice.</p>
      <h3 style="margin-top:20px">Model Part 2 answer (Band 8)</h3><div class="cue" style="border-width:1px;margin-top:8px;white-space:normal">${esc(sp.cueModel)}</div>
      <h3 style="margin-top:20px">Useful phrases</h3><ul style="margin:8px 0 0;padding-left:20px">${sp.phrases.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
      <h3 style="margin-top:20px">What examiners listen for at Band 8</h3><ul style="margin:8px 0 0;padding-left:20px;max-width:70ch">
        <li><b>Fluency</b>: you keep talking with only occasional hesitation, and your ideas connect.</li>
        <li><b>Vocabulary</b>: you use less common words and natural phrases correctly.</li>
        <li><b>Grammar</b>: you mix simple and complex sentences, and most of them are error-free.</li>
        <li><b>Pronunciation</b>: you are easy to understand, with natural stress and intonation.</li></ul>`;
  }
  $("#ebody").innerHTML=`<div class="card" style="min-height:300px">${body}</div>`;
  const isEnd=s.kind==="end";
  $("#enav").innerHTML=`<div class="wrap"><div class="navrow">
    <span class="muted mono" style="font-size:14px">${ex.step+1} / ${steps.length}</span>
    <div class="row">${ex.step>0&&!isEnd?`<button class="btn ghost sm" id="spPrev">Back</button>`:""}
    ${isEnd?`${nextBtn()}<button class="btn sm" data-home>Back to tests</button>`:`<button class="btn sm" id="spNext">${s.kind==="intro"?"Start Part 1":"Next question"}</button>`}</div></div></div>`;
  if(isEnd&&!ex.spokeSaved){ex.spokeSaved=true; store.attempts.push({test:ex.test.id,sec:"speaking",band:null,score:"Practice",date:new Date().toISOString()}); save();}
  const nx=$("#spNext"); if(nx) nx.addEventListener("click",()=>{ex.step++; renderSpeaking(); window.scrollTo(0,0);});
  const pv=$("#spPrev"); if(pv) pv.addEventListener("click",()=>{ex.step--; renderSpeaking();});
  bindAfter();
  const cb=$("#cueBtn");
  if(cb){let left=60,phase="prep";
    const draw=()=>{$("#cueClock").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");};
    cb.addEventListener("click",()=>{ if(cueId) return; cb.disabled=true; $("#cueHint").textContent=phase==="prep"?"Make notes.":"Speak now. Keep going until the timer ends.";
      cueId=setInterval(()=>{left--; if(!$("#cueClock")){clearInterval(cueId); cueId=null; return;} draw(); if(left<=0){clearInterval(cueId); cueId=null;
        if(phase==="prep"){phase="talk"; left=120; draw(); cb.disabled=false; cb.textContent="Start speaking (2 minutes)"; $("#cueHint").textContent="Preparation time is over.";}
        else {$("#cueHint").textContent="Time. Press Next question."; cb.textContent="Done";}}},1000);});
  }
}

home();
})();
</script>
</body></html>
